loop: false
focus_mode: exit
await_focus: true
steps:
  - wait_on:
      template: my_car_menu
  - press: "y"
  - wait: 0.5
  - repeat:
      key: down
      times: 2
  - press: enter
  - press: escape
  # Find and purge
  - scroll_to: target
  - purge:
      template: target
      marker: delete_marker
      brand_new: false
